services:
  ollama:
    image: ollama/ollama:latest
    container_name: retrofit-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    restart: unless-stopped

volumes:
  ollama_data:
    external: true
    name: ollama_ollama_data
